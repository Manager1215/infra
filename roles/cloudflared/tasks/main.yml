---
- name: Add Cloudflare repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: [deb]
    uris: https://pkg.cloudflare.com/cloudflared
    suites: [any]
    components: [main]
    signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Point each hostname at the tunnel
  ansible.builtin.command:
    cmd: "cloudflared tunnel route dns {{ cloudflared_tunnel_name }} {{ item.hostname }}"
  register: cloudflared_route
  changed_when: "'Added' in cloudflared_route.stderr"
  loop: "{{ cloudflared_ingress }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Create /etc/cloudflared
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    mode: "0755"

- name: Render tunnel config
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/cloudflared/config.yml
    mode: "0644"
  notify: Restart cloudflared

- name: Install cloudflared service
  ansible.builtin.command:
    cmd: cloudflared service install
    creates: /etc/systemd/system/cloudflared.service

- name: Start cloudflared
  ansible.builtin.systemd:
    name: cloudflared
    state: started
    enabled: true
