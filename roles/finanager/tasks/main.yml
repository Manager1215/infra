---
- name: Create Finanager directory
  ansible.builtin.file:
    path: "{{ finanager_dir }}"
    state: directory
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0755"

- name: Log in to GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ finanager_ghcr_user }}"
    password: "{{ finanager_ghcr_token }}"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ finanager_dir }}/docker-compose.yml"
    mode: "0644"

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ finanager_dir }}/.env"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0600"
  no_log: true

- name: Pull images and start Finanager
  community.docker.docker_compose_v2:
    project_src: "{{ finanager_dir }}"
    pull: always
    state: present
