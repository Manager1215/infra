---
- name: Test sshd config
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false
  listen: Restart sshd

- name: Restart sshd service
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: Restart sshd

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
