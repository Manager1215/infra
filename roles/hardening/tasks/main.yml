---
- name: Install fail2ban and unattended-upgrades
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# 10- so it wins over 50-cloud-init.conf
- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
  notify: Restart sshd

- name: Configure fail2ban jail for sshd
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: hardening_unattended_upgrades

- name: Start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
