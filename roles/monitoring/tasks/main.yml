---
- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Copy prometheus.yml
  ansible.builtin.copy:
    src: prometheus.yml
    dest: "{{ monitoring_dir }}/prometheus.yml"
    mode: "0644"

- name: Copy Grafana provisioning and dashboards
  ansible.builtin.copy:
    src: grafana/
    dest: "{{ monitoring_dir }}/grafana/"
    mode: "0644"
    directory_mode: "0755"

- name: Start monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present

# env password only works on first start
- name: Check Grafana admin password
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/user"
    user: admin
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: monitoring_grafana_login
  retries: 6
  delay: 5
  until: monitoring_grafana_login.status in [200, 401]
  no_log: true

- name: Reset Grafana admin password
  ansible.builtin.command:
    cmd: >-
      docker exec grafana grafana cli --homepath /usr/share/grafana
      admin reset-admin-password {{ grafana_admin_password }}
  when: monitoring_grafana_login.status != 200
  changed_when: true
  no_log: true
